# Boring source registry
#
# Every external source referenced by a rule or edge case has exactly one
# entry here. Tiers classify the *kind* of evidence (see docs/sources.md):
#   1 standard | 2 authoritative-guidance | 3 vendor-docs
#   4 corpus   | 5 incident-report         | 6 community
# `accessed` records the date the content was last verified by a human.
# All URLs below were verified live on 2026-09-04 during v0.1 research.

# --- Tier 1: standards and specifications -------------------------------------

- id: RFC-9110
  title: HTTP Semantics (RFC 9110)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc9110
  topics: [http, methods, status-codes, idempotency]
  accessed: "2026-09-04"
  notes: >
    Idempotent methods (§9.2.2) and 2xx success semantics (§15.3) anchor the
    webhook delivery rules.

- id: RFC-8259
  title: The JavaScript Object Notation (JSON) Data Interchange Format (RFC 8259)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc8259
  topics: [json, payloads, numbers]
  accessed: "2026-09-04"
  notes: >
    Numbers that cannot be represented (NaN, Infinity) are not permitted (§6);
    object member names SHOULD be unique (§4).

- id: RFC-8725
  title: Best Current Practices for JSON Web Tokens (RFC 8725)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc8725
  topics: [jwt, tokens, sessions]
  accessed: "2026-09-04"
  notes: >
    Algorithm and claim validation requirements for JWT-based sessions.

- id: RFC-3339
  title: "Date and Time on the Internet: Timestamps (RFC 3339)"
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc3339
  topics: [timestamps, time]
  accessed: "2026-09-04"
  notes: >
    Timestamp grammar (§5.6): Z denotes UTC offset zero (§2); -00:00 signals
    unknown local offset (§4.3); time-second may be 60 at leap seconds
    (§5.6, §5.7); a space may replace T by NOTE.

- id: RFC-5321
  title: Simple Mail Transfer Protocol (RFC 5321)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc5321
  topics: [email, smtp]
  accessed: "2026-09-04"
  notes: >
    Local-part limit 64 octets (§4.5.3.1.1), path limit 256 octets
    (§4.5.3.1.3), address literals (§4.1.3); local-part case sensitivity
    (§2.4) and its interoperability warning.

- id: RFC-5322
  title: Internet Message Format (RFC 5322)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc5322
  topics: [email, syntax]
  accessed: "2026-09-04"
  notes: >
    dot-atom syntax (§3.2.3), quoted-string local parts and display names
    (§3.4.1).

- id: RFC-6531
  title: SMTP Extension for Internationalized Email (SMTPUTF8) (RFC 6531)
  organization: IETF
  type: standard
  tier: 1
  url: https://www.rfc-editor.org/rfc/rfc6531
  topics: [email, internationalization]
  accessed: "2026-09-04"
  notes: >
    Unicode local parts require end-to-end SMTPUTF8 support (§3.2, §3.4).

- id: RFC-5890
  title: "Internationalized Domain Names for Applications (IDNA): Definitions and Document Framework (RFC 5890)"
  organization: IETF
  type: standard
  tier: 1
