- id: UNICODE-UTS39
  title: Unicode Security Mechanisms (UTS #39)
  organization: Unicode Consortium
  type: standard
  tier: 1
  url: https://www.unicode.org/reports/tr39/
  topics: [unicode, security, identifiers]
  accessed: "2026-09-04"
  notes: >
    Confusable detection via skeleton comparison (§4); mixed-script detection
    (§5.1); identifier restrictions, including ZWJ/ZWNJ (§3.1, §7).

- id: UNICODE-TR36
  title: Unicode Security Considerations (UTS #36, tr36-15)
  organization: Unicode Consortium
  type: standard
  tier: 1
  url: https://www.unicode.org/reports/tr36/tr36-15.html
  topics: [unicode, security, text]
  accessed: "2026-09-04"
  notes: >
    Invisible characters affecting rendering (§2.4); non-visual bypasses when
    components treat text as identical after transformation (§3); visual
    spoofing via confusables (§2). Note: the canonical tr36 URL now serves a
    stabilization notice; the maintained text is at tr36-15.html.

- id: UNICODE-UTS46
