# --- Tier 2: authoritative application guidance --------------------------------

- id: OWASP-ASVS
  title: OWASP Application Security Verification Standard (ASVS) 5.0.0
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://owasp.org/www-project-application-security-verification-standard/
  topics: [authentication, sessions, security]
  accessed: "2026-09-04"
  notes: >
    Released 30 May 2025. V6 Authentication (credential reset, notifications
    6.3.7/6.3.8/6.4.3), V7 Session Management (timeouts 7.3.1/7.3.2, session
    termination 7.4.x, user session control 7.5.2), V9 Self-contained Tokens.

- id: OWASP-FORGOT-PASSWORD
  title: OWASP Forgot Password Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Forgot_Password_Cheat_Sheet.html
  topics: [authentication, password-reset]
  accessed: "2026-09-04"
  notes: >
    Primary source for the password-reset spec: enumeration resistance,
    token generation/expiry/single-use/storage, throttling, notifications,
    session invalidation, password policy on reset.

- id: OWASP-AUTHENTICATION
  title: OWASP Authentication Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
  topics: [authentication, passwords]
  accessed: "2026-09-04"
  notes: >
    Generic error messages, password length/composition/blocklist guidance,
    re-authentication for sensitive features.

- id: OWASP-SESSION-MANAGEMENT
  title: OWASP Session Management Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html
  topics: [sessions, cookies]
  accessed: "2026-09-04"
  notes: >
    Primary source for the sessions spec: ≥64-bit entropy, cookie attributes,
    renewal on authentication and privilege change, server-side logout,
    timeout ranges (idle 15-30 min low-risk / 2-5 min high-value; absolute
    4-8 h), no URL-based identifiers, user session control.

- id: OWASP-CSRF
  title: OWASP Cross-Site Request Forgery Prevention Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
  topics: [csrf, cookies, sessions]
  accessed: "2026-09-04"
  notes: >
    SameSite's role as a defense layer complementary to CSRF countermeasures.

- id: OWASP-FILE-UPLOAD
  title: OWASP File Upload Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
  topics: [file-uploads, validation]
  accessed: "2026-09-04"
  notes: >
    Primary source for the file-uploads spec: extension allowlists,
    content-vs-declared-type warnings, validation after decoding, randomized
    storage names ("essential"), protected storage locations, read access
    control "a must", size limits, zip bombs, archive handling, AV/sandbox
    advice. Note: it does not cover serving headers (Content-Disposition,
    nosniff) or image decompression bombs — those carry MDN citations or
    field-knowledge flags.

- id: OWASP-INPUT-VALIDATION
  title: OWASP Input Validation Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Input_Validation_Cheat_Sheet.html
  topics: [validation, input]
  accessed: "2026-09-04"
  notes: >
    Validate all potentially untrusted input as early as possible; allowlist
    over denylist; canonical encoding across text; free-form Unicode text
    (links UAX #15). Note: "validation after decoding" wording lives in the
    File Upload sheet, not here.

- id: OWASP-PASSWORD-STORAGE
  title: OWASP Password Storage Cheat Sheet
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
  topics: [passwords, storage, cryptography]
  accessed: "2026-09-04"
  notes: >
    Salted, slow hashing (Argon2id, bcrypt, PBKDF2), work factors — applied
    in Boring to reset-token storage.

- id: OWASP-WSTG
  title: OWASP Web Security Testing Guide (WSTG)
  organization: OWASP
  type: authoritative-guidance
  tier: 2
  url: https://owasp.org/www-project-web-security-testing-guide/
  topics: [testing, redirects, web]
  accessed: "2026-09-04"
  notes: >
    Standard test taxonomy; referenced for unvalidated redirect testing and
    general verification approaches.

- id: NIST-800-63B
  title: "NIST Special Publication 800-63B (Digital Identity Guidelines: Authentication and Authenticator Management), Revision 4"
  organization: NIST
  type: authoritative-guidance
  tier: 2
  url: https://pages.nist.gov/800-63-4/sp800-63b.html
  topics: [passwords, authentication, policy]
  accessed: "2026-09-04"
  notes: >
    Final Rev 4 (July 2025) supersedes 800-63B (Rev 3:
    https://pages.nist.gov/800-63-3/sp800-63b.html). Password minimums
    (15 single-factor / 8 with MFA), SHOULD allow ≥64 chars and all printing
    ASCII/Unicode with each code point counted as one character, SHALL NOT
    composition rules, SHALL blocklist breached passwords, SHALL rate-limit
    failed attempts. Rev 3 retained for readers on the earlier revision.

# --- Tier 3: official vendor behavior -------------------------------------------

- id: STRIPE-WEBHOOK-DOCS
  title: Stripe Webhooks documentation
  organization: Stripe
  type: vendor-docs
  tier: 3
  url: https://docs.stripe.com/webhooks
  topics: [webhooks, delivery, signatures]
  accessed: "2026-09-04"
  notes: >
    At-least-once delivery and duplicates; no ordering guarantee ("Don't use
    created to determine event order"); retries up to three days with
    exponential backoff; 2xx = delivered, redirects are failures; Stripe-
    Signature scheme (t= timestamp, v1 HMAC-SHA256, constant-time comparison);
    5-minute default replay tolerance; 2xx-before-logic best practice; secret
    rolling with previous secret active up to 24 hours.

- id: STRIPE-IDEMPOTENCY
  title: Stripe Idempotent Requests documentation
  organization: Stripe
  type: vendor-docs
  tier: 3
  url: https://docs.stripe.com/api/idempotent_requests
  topics: [idempotency, webhooks, api-design]
  accessed: "2026-09-04"
  notes: >
    Request-side idempotency mechanics ("safely retrying requests without
    accidentally performing the same operation twice") — supporting evidence
    for consumer-side idempotency design.

