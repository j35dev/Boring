schema_version: 1
dataset:
  id: auth-password-reset-state
  title: Authentication state — password reset
  description: >
    State, sequence, concurrency, and boundary situations around password-reset
    flows. Companion to the password-reset spec; each case names the rules it
    stresses.
  updated: "2026-09-04"

cases:
  - id: BORING-EDGE-AUTH-RESET-001
    title: Reset token reuse after successful completion
    kind: state
    risk: [security, correctness]
    scenario:
      given: a password-reset token that has already been used successfully
      when: the same token is submitted again
      expect:
        - the password is not changed
        - the token is rejected
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction; General Security Practices — Invalidated after they have been used"
        support: direct
        note: >
          OWASP requires single-use invalidation after use; this case tests the direct replay of a consumed token. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-004]
    tags: [reuse, tokens]

  - id: BORING-EDGE-AUTH-RESET-002
    title: Older outstanding token after a newer reset request
    kind: state
    risk: [security]
    scenario:
      given: two reset requests have been issued for one account, with two outstanding tokens
      when: the older token is submitted after the newer request was made
      expect:
        - behavior follows the application's documented outstanding-token policy (strong default of newest-token-wins)
    decision_required: true
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction; General Security Practices — single-use and invalidation"
        support: derived
        note: >
          OWASP defines no outstanding-token policy; Boring derives the bounded-exposure default from single-use invalidation. The enforceable expectation is the documented policy. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-013]
    tags: [tokens, policy]

  - id: BORING-EDGE-AUTH-RESET-003
    title: Password changed after the reset token was issued
    kind: state
    risk: [security]
    scenario:
      given: a reset token is outstanding and the account's password changes through another path (normal change, admin action, SSO linkage)
      when: the outstanding token is submitted
      expect:
        - behavior follows a defined policy; strong default is that the outstanding token is invalidated by the credential change
    decision_required: true
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction — Do not make a change to the account until a valid token is presented"
        support: derived
        note: >
          OWASP requires validation at completion but defines no credential-change invalidation policy; Boring derives the strong default from the single-credential-change principle. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-005, BORING-AUTH-RESET-013]
    tags: [tokens, lifecycle]

  - id: BORING-EDGE-AUTH-RESET-004
    title: Token submitted exactly at the expiry boundary
    kind: boundary
    risk: [correctness, security]
    scenario:
      given: a reset token with lifetime T
      when: the token is submitted at T minus one second, at exactly T, and at T plus one second
      expect:
        - the boundary is unambiguous (inclusive or exclusive, consistently enforced server-side)
        - clock comparison uses the server's clock, not client-supplied time
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction — expire after an appropriate period"
        support: direct
        note: >
          OWASP requires bounded lifetimes; the boundary test (inclusive/exclusive, server clock) is Boring's enforcement of an unambiguous expiry check at completion time. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-003]
    tags: [expiry, boundary]

  - id: BORING-EDGE-AUTH-RESET-005
    title: Concurrent completions with the same token
    kind: concurrency
    risk: [security, data-integrity]
    scenario:
      given: two completion requests carrying the same valid token
      when: they are processed simultaneously
      expect:
        - at most one completion succeeds
        - the loser is rejected or made ineffective, and sessions/sessions-invalidations behave as if a single reset occurred
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction; General Security Practices — Invalidated after they have been used"
        support: direct
        note: >
          Single-use invalidation directly implies at most one concurrent completion takes effect; atomic invalidation is Boring's enforcement under race. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-004]
    tags: [race, single-use]

  - id: BORING-EDGE-AUTH-RESET-006
    title: Reset requested for a deleted account
    kind: state
    risk: [privacy, correctness]
    scenario:
      given: an account that has been deleted (or is in a grace period)
      when: a password reset is requested for its address
      expect:
        - the public response is indistinguishable from a non-existent account
        - no account is silently resurrected by the reset flow
    sources: [OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction; Forgot Password Request — consistent message for existent and non-existent accounts"
        support: direct
        note: >
          Enumeration resistance directly covers deleted accounts; non-resurrection is Boring's enforcement that the flow must not undo deletion. Original Boring scenario.
    related_rules: [BORING-AUTH-RESET-001]
    tags: [enumeration, deletion]

  - id: BORING-EDGE-AUTH-RESET-007
    title: Reset requested for an account without a password
    kind: state
    risk: [security, correctness]
    scenario:
      given: an account that authenticates only via an external identity provider (no local password credential exists)
      when: a password reset is requested for its address
      expect:
        - behavior follows a defined policy; the flow must not silently mint a local password that bypasses the external provider
        - the public response does not reveal that the account has no password credential
    decision_required: true
    sources: [OWASP-FORGOT-PASSWORD, OWASP-AUTHENTICATION]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction; Forgot Password Request — consistent message"
        support: derived
        note: >
          Enumeration resistance is borrowed for passwordless accounts; the no-silent-local-password policy is Boring's derived safeguard against bypassing the external provider. Original Boring scenario.
      - source: OWASP-AUTHENTICATION
        locator: "Authentication and Error Messages — Authentication Responses (generic message regardless of account state)"
        support: derived
        note: >
          Generic-response guidance is applied to the no-local-credential case; the IdP-bypass prohibition is Boring's derived policy, hence decision_required.
    related_rules: [BORING-AUTH-RESET-001, BORING-AUTH-RESET-005]
    tags: [oauth, enumeration]

  - id: BORING-EDGE-AUTH-RESET-008
    title: Email address changed after the token was issued
    kind: state
    risk: [security, privacy]
    scenario:
      given: a reset token was issued to address A, and the account's email subsequently changed to address B
      when: the token is submitted
      expect:
        - the token still resolves to the account it was issued for (not to an address string)
        - the delivery address used for any further communication follows a documented policy
    decision_required: true
    sources: [OWASP-FORGOT-PASSWORD, RFC-5321]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "General Security Practices — Linked to an individual user in the database"
        support: derived
        note: >
          Per-user linkage is derived as account binding rather than address-string binding when the address changes mid-flow; the onward-communication policy is Boring's decision point. Original Boring scenario.
      - source: RFC-5321
        locator: "§2.4 (local-part case sensitivity and interoperability warning)"
        support: contextual
        note: >
          Context for why address strings are unreliable identity keys; the binding requirement itself comes from OWASP, not from SMTP.
    related_rules: [BORING-AUTH-RESET-006]
    tags: [tokens, email-change]

  - id: BORING-EDGE-AUTH-RESET-009
    title: Reset completion on a deactivated or banned account
    kind: state
    risk: [security, correctness]
    scenario:
      given: an account that was deactivated or banned while a reset token was outstanding
      when: the reset is completed with the valid token
      expect:
        - account state is re-checked at completion time
        - the credential change does not restore access that the deactivation removed
    sources: [OWASP-FORGOT-PASSWORD, OWASP-AUTHENTICATION]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Introduction — Do not make a change to the account until a valid token is presented"
        support: derived
        note: >
          Completion-time validation is derived to include account-state re-checks, so a valid token cannot restore deactivated access. Original Boring scenario.
      - source: OWASP-AUTHENTICATION
        locator: "Authentication and Error Messages — Authentication Responses (locked or disabled accounts get the generic response)"
        support: contextual
        note: >
          Context that locked/disabled state must not leak through responses; the no-restore expectation is Boring's authorization safeguard.
    related_rules: [BORING-AUTH-RESET-005]
    tags: [account-state, authorization]

  - id: BORING-EDGE-AUTH-RESET-010
    title: Enumeration via timing and side channels
    kind: environment
    risk: [privacy, security]
    scenario:
      given: the reset request for an existing account performs extra work (hashing, database lookups, email queueing) that the non-existent path does not
      when: response times (or other side channels such as rate-limit counters) are measured across many requests
      expect:
        - the two paths are computationally indistinguishable in practice
        - throttling counters do not reveal account existence
    sources: [OWASP-FORGOT-PASSWORD, OWASP-AUTHENTICATION]
    evidence:
      - source: OWASP-FORGOT-PASSWORD
        locator: "Forgot Password Request — consistent time; Introduction — uniform response time"
        support: direct
        note: >
          Directly requires uniform timing via async or same-logic paths; throttling counters are Boring's extension of the same indistinguishability to side channels. Original Boring scenario.
      - source: OWASP-AUTHENTICATION
        locator: "Authentication and Error Messages — business logic can bring a timing discrepancy factor; same-process code example"
        support: direct
        note: >
          Directly documents processing-time discrepancy as enumeration and shows the same-process mitigation; applied here to the reset-request paths.
    related_rules: [BORING-AUTH-RESET-001, BORING-AUTH-RESET-007]
    tags: [timing, enumeration]

  - id: BORING-EDGE-AUTH-RESET-011
    title: Reset token leakage through URLs and logs
    kind: environment
    risk: [security, privacy]
    scenario:
      given: reset tokens are delivered as URL parameters in links
      when: browser history, server and proxy logs, Referer headers to third-party assets, analytics captures, and mail-client link previews are considered
      expect:
        - no channel retains a still-valid token; exposure channels are identified and mitigated deliberately
    sources: [OWASP-SESSION-MANAGEMENT, OWASP-FORGOT-PASSWORD]
    evidence:
      - source: OWASP-SESSION-MANAGEMENT
        locator: "Session Management Implementation — IDs in URLs disclose via links, logs, history, Referer, search engines; Logging — omit IDs from logs"
        support: derived
        note: >
          URL-secret disclosure channels documented for session IDs are derived for reset tokens, which are likewise bearer credentials. Original Boring scenario.
      - source: OWASP-FORGOT-PASSWORD
        locator: "URL Tokens — HTTPS reset URLs; Referrer-Policy noreferrer"
        support: direct
        note: >
          Directly requires HTTPS and noreferrer handling for reset links; previews and analytics retention are Boring's generalization to all channels holding a live token.
    related_rules: [BORING-AUTH-RESET-012]
    tags: [leakage, urls]

  - id: BORING-EDGE-AUTH-RESET-012
    title: Address that differs only by case, dots, or plus-tag
    kind: value
    risk: [correctness, security, privacy]
    scenario:
      given: a reset is requested for an address that normalizes (or does not normalize) to an existing account's address — differing in case, plus-tag suffix, or dot placement
      when: the reset flow resolves the request
      expect:
        - the application's address-normalization policy decides the resolution consistently, and the public response stays enumeration-safe either way
        - the token, once issued, is bound to the account — never to a client-controllable address string
    decision_required: true
    sources: [RFC-5321, RFC-5322, UNICODE-UTS46]
    evidence:
      - source: RFC-5321
        locator: "§2.4 (local-part case sensitivity and interoperability warning); §4.5.3.1 (path and local-part limits)"
        support: direct
        note: >
          Establishes that local-parts may be case-sensitive with interoperability consequences; applications must define their own normalization policy rather than assuming one. Original Boring scenario.
      - source: RFC-5322
        locator: "§3.2.3 (dot-atom); §3.4.1 (quoted-string local parts and display names)"
        support: contextual
        note: >
          Context for dot and quoting syntax that makes naive string equality wrong; the enumeration-safe resolution policy is Boring's requirement.
      - source: UNICODE-UTS46
        locator: "§2 (compatibility mapping for IDNA2008); §1.3.2 (transitional vs nontransitional Deviation handling)"
        support: contextual
        note: >
          Context for domain-side mapping differences that can make two spellings resolve together or apart; the consistent-policy expectation is Boring's.
    related_rules: [BORING-AUTH-RESET-001, BORING-AUTH-RESET-006]
    tags: [email, normalization, identity]
