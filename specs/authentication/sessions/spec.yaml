spec:
  id: sessions
  title: Sessions
  domain: authentication
  summary: >
    Behavior a correct session-management implementation must implement:
    identifier generation, lifecycle (login, logout, timeout, credential
    change, privilege change), cookie hardening, and token-based sessions.
  version: 0.1.0
  status: draft
  updated: "2026-09-04"
  applies_when:
    - The application maintains authenticated state across requests for users.
  does_not_apply_when:
    - The application is fully stateless per request (e.g., pure APIs authenticating every call) — rules about token-based sessions still apply where they are used.
  rules:
    - id: BORING-AUTH-SESSION-001
      title: Session identifiers must be unguessable and carry no meaning
      level: MUST
      status: draft
      summary: >
        Session identifiers must be generated with a cryptographically secure
        random generator, carry at least 64 bits of entropy, and contain no
        user, role, or other meaningful data.
      why:
        - Predictable session IDs let an attacker obtain valid sessions for other users.
        - OWASP requires at least 64 bits of entropy, generated by a CSPRNG (128+ bits recommended for custom-built identifiers).
        - Embedding PII or role data in the identifier leaks information wherever the identifier is logged or observed.
      applies_when:
        - Any server-issued session, cookie, or bearer identifier.
      exceptions: []
      failure_modes:
        - Sequential or timestamp-based session IDs.
        - Identifiers encoding username or role, or generated with a non-cryptographic PRNG.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: []
      related_rules: [BORING-AUTH-SESSION-011]
      verification:
        automatable: partial
        scenarios:
          - given: many session identifiers collected over time and across users
            when: the corpus is examined
            expect:
              - no structure, sequence, or cross-user predictability
      tags: [cryptography, session-ids]

    - id: BORING-AUTH-SESSION-002
      title: Regenerate the session identifier at authentication and privilege changes
      level: MUST
      status: draft
      summary: >
        The session identifier must be regenerated during login — replacing any
        pre-authentication identifier — and again after any privilege level
        change.
      why:
        - Regeneration at login is the standard defense against session fixation — an attacker who planted a known identifier gains nothing when it is replaced.
        - OWASP makes regeneration mandatory during authentication and after any privilege-level change.
      applies_when:
        - Sessions are established or elevated server-side.
      exceptions: []
      failure_modes:
        - Login keeps the attacker-chosen session ID (fixation).
        - A user promoted to admin keeps the identifier issued to their low-privilege session.
      sources: [OWASP-SESSION-MANAGEMENT]
      edge_cases: [BORING-EDGE-AUTH-SESSION-003]
      related_rules: [BORING-AUTH-SESSION-008]
      verification:
        automatable: yes
        scenarios:
          - given: a client holding a pre-authentication session identifier
            when: the client logs in
            expect:
              - the authenticated session uses a freshly generated identifier
          - given: an authenticated user whose privilege level changes
            when: the privilege change is applied
            expect:
              - the session identifier is regenerated
      tags: [fixation, lifecycle]

    - id: BORING-AUTH-SESSION-003
      title: Logout must invalidate the session server-side
      level: MUST
      status: draft
      summary: >
        Logout must destroy the session's server-side state (or, for
        self-contained tokens, revoke via key/allowlist mechanisms) — clearing
        the client cookie alone is not logout.
      why:
        - A cookie cleared client-side leaves the token valid; anyone who copied it continues to act as the user.
        - OWASP requires the application to invalidate the session at least on the server side; ASVS requires the same for logout (V7 7.4.1).
      applies_when:
        - Any session termination, user-initiated or system-initiated.
      exceptions: []
      failure_modes:
        - Logout only deletes the cookie; the stolen session still works.
        - A "logout everywhere" feature that clears cookies for all devices without invalidating any server-side session.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: [BORING-EDGE-AUTH-SESSION-002]
      related_rules: [BORING-AUTH-SESSION-007]
      verification:
        automatable: yes
        scenarios:
          - given: a captured copy of the session token
            when: the user logs out and the captured token is replayed
            expect:
              - the server rejects the token
      tags: [logout, containment]

    - id: BORING-AUTH-SESSION-004
      title: Sessions must have enforced idle and absolute timeouts
      level: MUST
      status: draft
      summary: >
        Sessions must expire after a period of inactivity and after a maximum
        absolute lifetime, enforced server-side. As guidance: idle timeouts of
        15–30 minutes for lower-risk applications (less for high-value), absolute
        lifetimes in the 4–8 hour range for typical applications.
      why:
        - Without timeouts, a stolen session or an abandoned kiosk login is valid forever.
        - OWASP gives concrete ranges, idle timeouts of 2–5 minutes for high-value applications and 15–30 minutes for low-risk, with 4–8 hours as an appropriate absolute timeout range.
        - ASVS requires inactivity and absolute timeouts sized by documented risk analysis (V7 7.3.1/7.3.2).
      applies_when:
        - Any session with a lifetime beyond a single request.
      exceptions:
        - Deliberate long-lived sessions (e.g., refresh-token models) must document the risk decision and compensate with rotation and revocation.
      failure_modes:
        - Sessions that never expire; "remember me" implemented by removing expiry entirely.
        - Timeouts enforced only client-side.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: [BORING-EDGE-AUTH-SESSION-004]
      related_rules: [BORING-AUTH-SESSION-012]
      verification:
        automatable: partial
        scenarios:
          - given: an idle session and a session beyond its absolute lifetime
            when: each is used
            expect:
              - both are rejected server-side
      tags: [timeouts, lifecycle]

    - id: BORING-AUTH-SESSION-005
      title: Cookie-based sessions must set Secure and HttpOnly
      level: MUST
      status: draft
      summary: >
        Session cookies must be marked Secure and HttpOnly: Secure prevents the
        identifier from crossing cleartext connections; HttpOnly blocks its
        theft by scripts after XSS.
      why:
        - OWASP marks both attributes as mandatory for session cookies.
        - Without HttpOnly, every XSS becomes a session-hijacking vector; without Secure, one network downgrade leaks the identifier.
      applies_when:
        - Session identifiers are stored in cookies.
      does_not_apply_when:
        - Sessions are carried by bearer tokens outside cookies.
      exceptions: []
      failure_modes:
        - Session cookie without HttpOnly reachable from injected scripts.
        - Secure omitted so the cookie rides on http:// or is stripped on the HTTPS redirect.
      sources: [OWASP-SESSION-MANAGEMENT]
      edge_cases: []
      related_rules: [BORING-AUTH-SESSION-006]
      verification:
        automatable: yes
        scenarios:
          - given: a Set-Cookie response establishing a session
            when: its attributes are inspected
            expect:
              - Secure and HttpOnly are present
      tags: [cookies, security]

    - id: BORING-AUTH-SESSION-006
      title: Cookie-based sessions must set a SameSite policy
      level: SHOULD
      status: draft
      summary: >
        Session cookies must set SameSite=Strict (preferred) or SameSite=Lax;
        SameSite=None must never be used without Secure.
      why:
        - SameSite is the browser's cross-site request boundary; without it, session cookies ride on cross-site forged requests.
        - OWASP requires an explicit SameSite policy (Strict preferred) and forbids None without Secure.
        - SameSite complements but does not replace CSRF defenses (OWASP CSRF Cheat Sheet).
      applies_when:
        - Session identifiers are stored in cookies.
      does_not_apply_when:
        - Sessions are carried by bearer tokens outside cookies.
      exceptions: []
      failure_modes:
        - No SameSite attribute, falling back to browser defaults that differ per browser and version.
        - SameSite=None without Secure, which browsers reject or expose.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-CSRF]
      edge_cases: []
      related_rules: [BORING-AUTH-SESSION-005]
      verification:
        automatable: yes
        scenarios:
          - given: a Set-Cookie response establishing a session
            when: its attributes are inspected
            expect:
              - an explicit SameSite policy of Strict or Lax is present
      tags: [cookies, csrf]

    - id: BORING-AUTH-SESSION-007
      title: Credential changes must invalidate existing sessions
      level: MUST
      status: draft
      summary: >
        After a password change or reset, all sessions established before the
        change must be invalidated — automatically or by explicit user choice —
        so that a credential theft ends when the credential does.
      why:
        - The most common reason to change a password is suspicion that someone else has it; keeping their sessions alive defeats the action.
        - OWASP requires regeneration/invalidation after password changes; ASVS requires the option to terminate all other sessions after any change or removal of an authentication factor (V7 7.4.3).
      applies_when:
        - Passwords are changed or reset through any flow.
      exceptions: []
      failure_modes:
        - The attacker's session survives the victim's password change.
        - Reset completes without touching the session store.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS, OWASP-FORGOT-PASSWORD]
      edge_cases: [BORING-EDGE-AUTH-SESSION-001]
      related_rules: [BORING-AUTH-RESET-009]
      verification:
        automatable: partial
        scenarios:
          - given: sessions from before a password change
            when: they are used after the change
            expect:
              - they are rejected (or were explicitly preserved by the user's documented choice)
      tags: [sessions, containment]

    - id: BORING-AUTH-SESSION-008
      title: Privilege changes must take effect in active sessions
      level: MUST
      status: draft
      summary: >
        Authorization changes — role changes, permission revocations, account
        disabling or deletion — must be reflected in already-active sessions
        within a bounded, documented window: by regenerating/refreshing the
        session, re-evaluating permissions per request, or terminating the
        session.
      why:
        - A demoted admin or revoked employee must not keep working through an existing session.
        - OWASP requires session renewal after any privilege-level change; ASVS requires terminating sessions when accounts are disabled or deleted (V7 7.4.2).
      applies_when:
        - Authorization state can change while sessions are active.
      exceptions: []
      failure_modes:
        - Permissions read once at login and cached for the session lifetime.
        - Disabled accounts retain working sessions until natural expiry.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: [BORING-EDGE-AUTH-SESSION-005]
      related_rules: [BORING-AUTH-SESSION-002]
      verification:
        automatable: partial
        scenarios:
          - given: an active session for a user whose privileges are subsequently revoked
            when: the session requests a resource requiring the revoked privilege
            expect:
              - access is denied within the documented propagation window
      tags: [authorization, lifecycle]

    - id: BORING-AUTH-SESSION-009
      title: Sensitive operations must require re-authentication
      level: SHOULD
      status: draft
      summary: >
        High-impact operations — changing the password or email, changing MFA,
        viewing/terminating other sessions — should require the user to
        re-authenticate, not ride on an existing session.
      why:
        - An unattended or hijacked session should not be able to change the credential that controls the account.
        - OWASP recommends re-authentication for sensitive features and after high-risk events; ASVS applies the same to viewing and terminating sessions (V7 7.5.2).
      applies_when:
        - Operations can change who controls the account.
      exceptions: []
      failure_modes:
        - Password or MFA changes accepted from a stolen session with no re-entry of credentials.
      sources: [OWASP-AUTHENTICATION, OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: []
      related_rules: [BORING-AUTH-RESET-008]
      verification:
        automatable: partial
        scenarios:
          - given: an authenticated session
            when: a sensitive operation is attempted without fresh credentials
            expect:
              - re-authentication is demanded before the operation executes
      tags: [step-up, sensitive-operations]

    - id: BORING-AUTH-SESSION-010
      title: Users must be able to view and terminate their sessions
      level: SHOULD
      status: draft
      summary: >
        Users should be able to list their active sessions (device, recency) and
        terminate any of them — including sessions on other devices.
      why:
        - A "log out everywhere" action is the user's own containment tool for a stolen device or unknown session, complementing server-side rules.
        - OWASP recommends features to view session details and remotely terminate sessions; ASVS requires the same capability, protected by re-authentication (V7 7.5.2).
      applies_when:
        - Multiple sessions per account are possible (typical).
      exceptions: []
      failure_modes:
        - A user who loses a laptop has no way to end that device's session.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS]
      edge_cases: []
      related_rules: [BORING-AUTH-SESSION-003]
      verification:
        automatable: partial
        scenarios:
          - given: a user with sessions on several devices
            when: one session is terminated through the management UI
            expect:
              - that session is invalidated server-side; other sessions are unaffected
      tags: [user-control, containment]

    - id: BORING-AUTH-SESSION-011
      title: Session identifiers must not travel in URLs
      level: MUST
      status: draft
      summary: >
        Session identifiers must not be placed in URLs (path, query, or fragment);
        cookies or Authorization headers are the acceptable transports.
      why:
        - URLs leak through Referer headers to third-party resources, browser history, server and proxy logs, bookmarks, and sharing.
        - OWASP warns that URL-based session identifiers disclose the session ID through Referer and search engines.
      applies_when:
        - Any web application or HTTP API issuing sessions.
      exceptions: []
      failure_modes:
        - Session parameters such as ?sid=..., or tokens placed in the fragment for "SPA convenience".
        - Session IDs appearing in Referer headers of third-party analytics scripts.
      sources: [OWASP-SESSION-MANAGEMENT]
      edge_cases: []
      related_rules: [BORING-AUTH-SESSION-001]
      verification:
        automatable: yes
        scenarios:
          - given: the application's request handling
            when: session establishment and navigation are traced
            expect:
              - no session identifier appears in any URL
      tags: [leakage, urls]

    - id: BORING-AUTH-SESSION-012
      title: Token-based sessions need a revocation story and full claim verification
      level: SHOULD
      status: draft
      summary: >
        Self-contained tokens (JWTs, bearer tokens) used as sessions must be
        fully verified on every use (signature, issuer, audience, expiry) and
        must be short-lived or paired with a server-side revocation/denylist
        mechanism; they must not be stored in browser web storage.
      why:
        - A self-contained token cannot be individually invalidated by deleting server state — without revocation, logout, password change, and disablement do not reach it.
        - OWASP warns against storing session tokens and JWTs in web storage (readable by any script after XSS); ASVS covers logout/revocation for self-contained tokens (V7 7.4.1) with a dedicated chapter for self-contained tokens (V9).
        - JWT best current practice (RFC 8725) requires algorithm and claim validation on every use.
      applies_when:
        - Bearer tokens or JWTs represent login state.
      exceptions: []
      failure_modes:
        - Long-lived JWTs accepted until natural expiry; logout only forgets the client-side copy.
        - Signature verified but audience/expiry/algorithm not checked (cross-service token confusion).
        - Tokens in localStorage, one XSS away from hijacking.
      sources: [OWASP-SESSION-MANAGEMENT, OWASP-ASVS, RFC-8725]
      edge_cases: [BORING-EDGE-AUTH-SESSION-006]
      related_rules: [BORING-AUTH-SESSION-003, BORING-AUTH-SESSION-004]
      verification:
        automatable: partial
        scenarios:
          - given: a logged-out (or revoked) self-contained token
            when: it is presented to the API
            expect:
              - it is rejected per the documented revocation mechanism
          - given: a token with a valid signature but wrong audience or expired claim
            when: it is presented
            expect:
              - it is rejected
      tags: [jwt, bearer, revocation]
